openapi: 3.0.3
info:
  title: Arco Enterprise Admin API
  version: 0.1.0
  description: Spring Boot 管理后台示例契约，建议由 springdoc-openapi 的 /v3/api-docs 替换。
servers:
  - url: /
tags:
  - name: Auth
  - name: Dashboard
  - name: Users
  - name: Roles
paths:
  /api/auth/session:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: 获取当前登录用户
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: 登录成功，服务端写入 HttpOnly 会话 Cookie
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 退出登录
      responses:
        '204':
          description: 已退出
  /api/dashboard/summary:
    get:
      tags: [Dashboard]
      operationId: getDashboardSummary
      summary: 获取仪表盘摘要
      responses:
        '200':
          description: 仪表盘摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: 分页查询用户
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: keyword
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
      responses:
        '200':
          description: 用户分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      operationId: createUser
      summary: 创建用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/users/{userId}:
    patch:
      tags: [Users]
      operationId: updateUser
      summary: 更新用户
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/roles:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: 查询角色和权限
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/roles/{roleCode}:
    patch:
      tags: [Roles]
      operationId: updateRole
      summary: 更新角色权限和数据范围
      parameters:
        - name: roleCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: 角色已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: 未登录或会话已过期
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: 没有操作权限
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: 资源不存在
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    CurrentUser:
      type: object
      required: [id, displayName, email, permissions, roles, dataScope]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        avatarUrl:
          type: string
          format: uri
          nullable: true
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
        dataScope:
          $ref: '#/components/schemas/DataScope'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        remember:
          type: boolean
          default: false
    DashboardSummary:
      type: object
      required: [activeUsers, pendingApprovals, monthlyRevenue, systemHealth, trends, recentActivities]
      properties:
        activeUsers:
          type: integer
          format: int64
        pendingApprovals:
          type: integer
          format: int64
        monthlyRevenue:
          type: number
          format: double
        systemHealth:
          type: number
          format: double
          minimum: 0
          maximum: 100
        trends:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
        recentActivities:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
    TrendPoint:
      type: object
      required: [date, users, requests]
      properties:
        date:
          type: string
          format: date
        users:
          type: integer
        requests:
          type: integer
    Activity:
      type: object
      required: [id, actor, action, target, occurredAt, type]
      properties:
        id:
          type: string
          format: uuid
        actor:
          type: string
        action:
          type: string
        target:
          type: string
        occurredAt:
          type: string
          format: date-time
        type:
          type: string
          enum: [create, update, approve, alert]
    UserStatus:
      type: string
      enum: [active, invited, disabled]
    User:
      type: object
      required: [id, name, email, department, status, roles, lastActiveAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        department:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
        roles:
          type: array
          minItems: 1
          items:
            type: string
        lastActiveAt:
          type: string
          format: date-time
    UserPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    CreateUserRequest:
      type: object
      required: [name, email, department, roles]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        email:
          type: string
          format: email
        department:
          type: string
          minLength: 1
          maxLength: 50
        roles:
          type: array
          minItems: 1
          items:
            type: string
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        department:
          type: string
          minLength: 1
          maxLength: 50
        status:
          $ref: '#/components/schemas/UserStatus'
        roles:
          type: array
          minItems: 1
          items:
            type: string
    DataScope:
      type: string
      enum: [all, department, self]
    RoleSummary:
      type: object
      required: [code, name, dataScope, permissions]
      properties:
        code:
          type: string
        name:
          type: string
        dataScope:
          $ref: '#/components/schemas/DataScope'
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
    UpdateRoleRequest:
      type: object
      required: [dataScope, permissions]
      properties:
        dataScope:
          $ref: '#/components/schemas/DataScope'
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ProblemDetail:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
        traceId:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
