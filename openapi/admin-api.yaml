openapi: 3.0.3
info:
  title: Arco Enterprise Admin API
  version: 0.1.0
  description: Spring Boot 管理后台示例契约，建议由 springdoc-openapi 的 /v3/api-docs 替换。
servers:
  - url: /
tags:
  - name: Auth
  - name: Dashboard
  - name: Users
  - name: Roles
  - name: RBAC
paths:
  /api/auth/session:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: 获取当前登录用户
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: 登录成功，服务端写入 HttpOnly 会话 Cookie
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 退出登录
      responses:
        '204':
          description: 已退出
  /api/dashboard/summary:
    get:
      tags: [Dashboard]
      operationId: getDashboardSummary
      summary: 获取仪表盘摘要
      responses:
        '200':
          description: 仪表盘摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: 分页查询用户
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: keyword
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: sort
          in: query
          description: 单字段排序，仅支持 name 或 lastActiveAt，方向为 asc 或 desc。例如 sort=name,asc。
          schema:
            type: string
            pattern: '^(name|lastActiveAt),(asc|desc)$'
      responses:
        '200':
          description: 用户分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Users]
      operationId: createUser
      summary: 创建用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/users/{userId}:
    patch:
      tags: [Users]
      operationId: updateUser
      summary: 更新用户
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/role-options:
    get:
      tags: [RBAC]
      operationId: listRoleOptions
      summary: 获取可分配角色目录
      description: 需要 users:write authority；active=false 的角色仅用于展示已有分配。
      responses:
        '200':
          description: 角色选项目录
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleOption'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/permissions:
    get:
      tags: [RBAC]
      operationId: listPermissions
      summary: 获取权限目录
      description: 需要 roles:read authority；通配权限 * 返回为不可分配系统项。
      responses:
        '200':
          description: 权限目录
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionOption'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/roles:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: 查询角色和权限
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/roles/{roleCode}:
    patch:
      tags: [Roles]
      operationId: updateRole
      summary: 更新角色权限和数据范围
      parameters:
        - name: roleCode
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/RoleCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: 角色已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: 未登录或会话已过期
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: 没有操作权限
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: 资源不存在
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalServerError:
      description: 服务暂时不可用
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ServiceUnavailable:
      description: 服务暂时不可用
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    RoleCode:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$'
      description: 创建后不可变的小写 kebab-case 角色代码。
    PermissionCode:
      type: string
      pattern: '^(\*|[a-z][a-z0-9-]*:[a-z][a-z0-9-]*)$'
      description: resource:action 格式的权限代码，* 仅为系统通配项。
    CurrentUser:
      type: object
      required: [id, displayName, email, permissions, roleCodes, dataScope]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        avatarUrl:
          type: string
          format: uri
          nullable: true
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionCode'
        roleCodes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RoleCode'
        dataScope:
          $ref: '#/components/schemas/DataScope'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        remember:
          type: boolean
          default: false
    DashboardSummary:
      type: object
      required: [activeUsers, pendingApprovals, monthlyRevenue, systemHealth, trends, recentActivities]
      properties:
        activeUsers:
          type: integer
          format: int64
        pendingApprovals:
          type: integer
          format: int64
        monthlyRevenue:
          type: number
          format: double
        systemHealth:
          type: number
          format: double
          minimum: 0
          maximum: 100
        trends:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
        recentActivities:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
    TrendPoint:
      type: object
      required: [date, users, requests]
      properties:
        date:
          type: string
          format: date
        users:
          type: integer
        requests:
          type: integer
    Activity:
      type: object
      required: [id, actor, action, target, occurredAt, type]
      properties:
        id:
          type: string
          format: uuid
        actor:
          type: string
        action:
          type: string
        target:
          type: string
        occurredAt:
          type: string
          format: date-time
        type:
          type: string
          enum: [create, update, approve, alert]
    UserStatus:
      type: string
      enum: [active, invited, disabled]
    User:
      type: object
      required: [id, name, email, department, status, roleCodes, lastActiveAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        department:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
        roleCodes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RoleCode'
        lastActiveAt:
          type: string
          format: date-time
    UserPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    CreateUserRequest:
      type: object
      required: [name, email, department, roleCodes]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        email:
          type: string
          format: email
        department:
          type: string
          minLength: 1
          maxLength: 50
        roleCodes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RoleCode'
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        department:
          type: string
          minLength: 1
          maxLength: 50
        status:
          $ref: '#/components/schemas/UserStatus'
        roleCodes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RoleCode'
    DataScope:
      type: string
      enum: [all, department, self]
    RoleSummary:
      type: object
      required: [code, name, dataScope, permissions]
      properties:
        code:
          $ref: '#/components/schemas/RoleCode'
        name:
          type: string
        dataScope:
          $ref: '#/components/schemas/DataScope'
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionCode'
    RoleOption:
      type: object
      required: [code, name, active]
      properties:
        code:
          $ref: '#/components/schemas/RoleCode'
        name:
          type: string
        active:
          type: boolean
    UpdateRoleRequest:
      type: object
      required: [dataScope, permissions]
      properties:
        dataScope:
          $ref: '#/components/schemas/DataScope'
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionCode'
    PermissionOption:
      type: object
      required: [code, name, group, assignable]
      properties:
        code:
          $ref: '#/components/schemas/PermissionCode'
        name:
          type: string
        group:
          type: string
        assignable:
          type: boolean
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ProblemDetail:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
        traceId:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
